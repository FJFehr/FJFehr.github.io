# Publications List
# Displayed on the homepage in the Publications section
#
# Supported fields per entry:
#   id        (required) — unique number
#   title     (required) — paper title
#   authors   (required) — author list; the value of author_name_pattern in config.yaml is bolded
#   venue     (required) — full venue name
#   conference (required) — short conference label (e.g. "ACL 2025")
#   paper     (optional) — URL to paper
#   poster    (optional) — path or URL to poster PDF
#   slides    (optional) — path or URL to slides PDF
#   video     (optional) — URL to talk/demo video
#   code      (optional) — URL to code repository
#   demo      (optional) — URL to live demo
#   image     (optional) — path to thumbnail image

# Example:
# - id: 1
#   title: "My Paper Title"
#   authors: "A. Author, B. Coauthor"
#   venue: "Annual Meeting of the Association for Computational Linguistics"
#   conference: "ACL 2025"
#   paper: "https://arxiv.org/abs/XXXX.XXXXX"
#   image: "content/publications/files/my_paper_thumbnail.png"
